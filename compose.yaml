services:
  api:
    build:
      context: ./api
      target: dev
    working_dir: /var/www/html/api
    environment:
      HOMOCHECKER_AP_ACTOR_ID: http://localhost/actor
      HOMOCHECKER_AP_ACTOR_PREFERRED_USERNAME: localhost
      HOMOCHECKER_AP_ACTOR_PUBLIC_KEY: /activity_pub_actor.pub
      HOMOCHECKER_AP_ACTOR_PRIVATE_KEY: /activity_pub_actor.key
      HOMOCHECKER_DB_HOST: database
      HOMOCHECKER_DB_USERNAME: homo
      HOMOCHECKER_DB_PASSWORD: homo
      HOMOCHECKER_LOG_LEVEL: debug
    configs:
      - source: activity_pub_actor_public_key
        target: activity_pub_actor.pub
      - source: activity_pub_actor_private_key
        target: activity_pub_actor.key
    user: "33"
    group_add:
      - "0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/www/.composer:uid=33,gid=33,nodev,noexec,nosuid
      - /tmp:mode=1777,nodev,noexec,nosuid
    pre_start:
      - command: mkdir -p --mode=2770 ./build ./vendor
        user: "0"
      - command: composer install --no-progress --no-scripts
      - command: composer dump-autoload --no-scripts --optimize
    volumes:
      - type: bind
        source: ./api
        target: /var/www/html/api

  build:
    build:
      context: ./web
      target: dependencies
    working_dir: /usr/src
    command: yarn watch
    user: "1000"
    group_add:
      - "0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /home/node:uid=1000,gid=1000,nodev,noexec,nosuid
      - /tmp:mode=1777,dev,exec,nosuid
    pre_start:
      - command: mkdir -p --mode=2770 ./.yarn ./dist ./node_modules
        user: "0"
      - command: yarn --immutable
    volumes:
      - type: bind
        source: ./web
        target: /usr/src

  web:
    image: nginx/nginx-unprivileged:1.31
    ports:
      - "${HOMOCHECKER_PORT-4545}:80"
    environment:
      HOMOCHECKER_API_HOST: api
    user: "101"
    group_add:
      - "0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:nodev,noexec,nosuid
      - /tmp:mode=1777,nodev,noexec,nosuid
    volumes:
      - type: bind
        source: ./web/conf
        target: /etc/nginx/templates
        read_only: true
      - type: bind
        source: ./web/dist
        target: /var/www/html
        read_only: true

  database:
    image: postgres:18.6
    environment:
      PGUSER: homo
      POSTGRES_DB: homo
      POSTGRES_USER: homo
      POSTGRES_PASSWORD: homo
    user: "999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run/postgresql:nodev,noexec,nosuid
      - /tmp:mode=1777,nodev,noexec,nosuid
    volumes:
      - type: bind
        source: ./database
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: volume
        source: database
        target: /var/lib/postgresql

configs:
  activity_pub_actor_public_key:
    file: ./api/activity_pub_actor.pub
  activity_pub_actor_private_key:
    file: ./api/activity_pub_actor.key

volumes:
  database:
    driver: local
